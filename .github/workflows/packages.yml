name: Build packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to attach the builds to (required for manual runs)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve the release tag and the per-format version strings once, so the
  # three build jobs below can run in parallel.
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      deb_version: ${{ steps.version.outputs.deb_version }}
      arch_version: ${{ steps.version.outputs.arch_version }}
    steps:
      - name: Resolve release version
        id: version
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${EVENT_TAG:-$DISPATCH_TAG}"
          if [ -z "$TAG" ]; then
            echo "No release tag supplied" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          # Debian orders a pre-release before the final version only with "~"
          # (1.0.0~rc2 < 1.0.0); Arch pkgver cannot contain "-".
          DEB_VERSION="${VERSION/-/\~}"
          ARCH_VERSION="${VERSION/-/}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "deb_version=$DEB_VERSION"
            echo "arch_version=$ARCH_VERSION"
          } >> "$GITHUB_OUTPUT"

  # One job per package format. They run in parallel; each one installs the
  # build dependencies, checks the release tag out and attaches only its own
  # artifact to the release.
  packages:
    needs: meta
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package: [arch, deb, appimage]

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja pkgconf curl \
            qt6-base qt6-declarative qt6-svg qt6-wayland qt6-tools \
            wayland libxkbcommon mpv ffmpeg taglib kirigami \
            hicolor-icon-theme plasma-integration qqc2-desktop-style \
            avahi dpkg patchelf github-cli

      - name: Check out repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Build Arch package
        if: matrix.package == 'arch'
        env:
          LUMA_PKGVER: ${{ needs.meta.outputs.arch_version }}
        run: |
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su - builder -c "cd '$GITHUB_WORKSPACE' && LUMA_PKGVER='$LUMA_PKGVER' makepkg -f --nodeps"
          PKG="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name 'luma-*.pkg.tar.zst' -print -quit)"
          test -n "$PKG"
          mkdir -p dist
          cp "$PKG" "dist/$(basename "$PKG")"

      - name: Build Debian package
        if: matrix.package == 'deb'
        env:
          DEB_VERSION: ${{ needs.meta.outputs.deb_version }}
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh

      - name: Build AppImage
        if: matrix.package == 'appimage'
        env:
          APPIMAGE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          chmod +x build-appimage.sh
          ./build-appimage.sh

      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          PACKAGE: ${{ matrix.package }}
        run: |
          case "$PACKAGE" in
            arch) FILES="dist/*.pkg.tar.zst" ;;
            deb) FILES="dist/*.deb" ;;
            appimage) FILES="dist/*.AppImage" ;;
          esac
          gh release upload "$TAG" $FILES --clobber
