name: Build packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to attach the builds to (required for manual runs)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deb-appimage:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 90

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja pkgconf curl \
            qt6-base qt6-declarative qt6-svg qt6-wayland qt6-tools \
            wayland libxkbcommon mpv ffmpeg taglib kirigami \
            hicolor-icon-theme plasma-integration qqc2-desktop-style \
            avahi dpkg patchelf github-cli

      - name: Check out repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Resolve release tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${EVENT_TAG:-$DISPATCH_TAG}"
          if [ -z "$TAG" ]; then
            echo "No release tag supplied" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build Debian package and AppImage
        run: |
          chmod +x build-deb.sh build-appimage.sh
          export DEB_VERSION="$RELEASE_VERSION"
          export APPIMAGE_VERSION="$RELEASE_VERSION"
          ./build-deb.sh
          ./build-appimage.sh

      - name: Build Arch package
        run: |
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su - builder -c "cd '$GITHUB_WORKSPACE' && makepkg -f --nodeps"
          PKG="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name 'luma-*.pkg.tar.zst' -print -quit)"
          test -n "$PKG"
          cp "$PKG" "dist/luma-${RELEASE_VERSION}-1-$(uname -m).pkg.tar.zst"

      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" dist/*.deb dist/*.AppImage dist/*.pkg.tar.zst --clobber
